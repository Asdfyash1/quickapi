[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quickapi"
version = "1.0.0"
description = "A CLI tool to scaffold production-ready FastAPI projects in seconds"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Yashwanth", email = "yashgfghdd@gmail.com"},
]
keywords = ["cli", "fastapi", "scaffolding", "boilerplate", "api", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Framework :: FastAPI",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "jinja2>=3.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Asdfyash1/quickapi"
Repository = "https://github.com/Asdfyash1/quickapi"
Issues = "https://github.com/Asdfyash1/quickapi/issues"

[project.scripts]
quickapi = "quickapi.cli:main"

[tool.setuptools.packages.find]
include = ["quickapi*"]

[tool.setuptools.package-data]
quickapi = ["templates/*.j2"]
